name: Mobile CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://backend-nursepulse-qfct.onrender.com/api/v1

      - name: Distribute to Firebase App Distribution
        run: |
          npx firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app 1:945075743268:android:58b6bf963cfb8b4ab906b1 \
            --groups "testers" \
            --release-notes "Build automático desde ${{ github.sha }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Read app version
        id: app_version
        run: |
          version=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          name: NursePulse v${{ steps.app_version.outputs.version }} (build ${{ github.run_number }})
          body: Build automático desde ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true