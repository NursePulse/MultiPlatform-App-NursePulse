name: Mobile CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
    
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://backend-nursepulse-qfct.onrender.com/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nursepulse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  distribute:
    name: Distribute Android
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: nursepulse-android-apk
          path: build/app/outputs/flutter-apk

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app 1:945075743268:android:58b6bf963cfb8b4ab906b1 \
            --groups "testers" \
            --release-notes "Build automático desde ${{ github.sha }}" \
            --token "$FIREBASE_TOKEN"

      - name: Read app version
        id: app_version
        run: |
          version=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          name: NursePulse v${{ steps.app_version.outputs.version }} (build ${{ github.run_number }})
          body: Build automático desde ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true